services:
  - type: web
    name: apzelio-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker --timeout 120 server:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: EMERGENT_LLM_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.8
